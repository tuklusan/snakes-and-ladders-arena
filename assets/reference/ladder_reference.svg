<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="240" height="400">
  <!-- REFERENCE for ladder style (based on user's example image): two straight parallel
       rails with evenly-spaced rungs. On the board a ladder runs foot-tile -> top-tile
       at an angle; draw this shape rotated to the foot->top axis. Rails and rungs are the
       same color (green #2ecc71 in the game; black here to match the source image). -->
  <rect width="120" height="200" fill="#ffffff"/>
  <g stroke="#111" stroke-width="6" stroke-linecap="round" fill="none">
    <!-- two rails -->
    <line x1="40" y1="12" x2="40" y2="188"/>
    <line x1="80" y1="12" x2="80" y2="188"/>
    <!-- rungs: evenly spaced crossbars between the rails -->
    <line x1="40" y1="28"  x2="80" y2="28"/>
    <line x1="40" y1="48"  x2="80" y2="48"/>
    <line x1="40" y1="68"  x2="80" y2="68"/>
    <line x1="40" y1="88"  x2="80" y2="88"/>
    <line x1="40" y1="108" x2="80" y2="108"/>
    <line x1="40" y1="128" x2="80" y2="128"/>
    <line x1="40" y1="148" x2="80" y2="148"/>
    <line x1="40" y1="168" x2="80" y2="168"/>
  </g>
</svg>

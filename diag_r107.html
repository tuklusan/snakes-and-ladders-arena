<!doctype html><meta charset=utf-8><title>dr107</title>
<style>body{margin:0;font:16px monospace}#f{width:1280px;height:620px;border:0}
#out{font:bold 20px monospace;background:#111;color:#0f0;padding:10px;white-space:pre}</style>
<iframe id=f src="index.html"></iframe>
<div id=out>starting...</div>
<script>
let games=0, resets=0, prevOver=false, started=Date.now(), log=[];
setInterval(function(){
  var w=document.getElementById("f").contentWindow;
  var s="waiting for model";
  try{
    var m=w.gameModel;
    if(m){
      var over=!!m.game_over;
      var t=((Date.now()-started)/1000)|0;
      if(over && !prevOver){ games++; log.push("t="+t+"s GAME "+games+" WON by P"+((m.winner|0)+1)); }
      if(!over && prevOver){ resets++; log.push("t="+t+"s RESET "+resets); }
      prevOver=over;
      s="GAMES_COMPLETED: "+games+"\nRESETS: "+resets
        +"\nelapsed: "+t+"s"
        +"\npositions: ["+m.pawn_positions.join(", ")+"]"
        +"\ngame_over: "+over+"\n"+log.slice(-6).join("\n");
    }
  }catch(e){ s="ERR "+e.message; }
  document.getElementById("out").textContent=s;
},500);
</script>

<!doctype html><meta charset=utf-8><title>sweep</title>
<style>html,body{margin:0}#f{width:1280px;height:1600px;border:0}</style>
<iframe id=f src="index.html"></iframe><pre id=out>pending</pre>
<script>
const GL=0.30,GR=99.68,GT=3.33,GB=98.65,NR=4953/6605;
function run(){
 const fr=document.getElementById("f"), d=fr.contentDocument, w=fr.contentWindow;
 const O=[];
 if(!w.gameView||!w.gameModel){document.getElementById("out").textContent="NO GLOBALS";return;}
 const b=d.getElementById("game-board"), br=b.getBoundingClientRect();
 let iw,ih; if(br.width/br.height>NR){ih=br.height;iw=ih*NR;}else{iw=br.width;ih=iw/NR;}
 const ix=br.left+(br.width-iw)/2, iy=br.top+(br.height-ih)/2;
 const gx=ix+iw*GL/100,gw=iw*(GR-GL)/100,gy=iy+ih*GT/100,gh=ih*(GB-GT)/100;
 const cw=gw/10,ch=gh/10;
 O.push("grid x="+gx.toFixed(1)+" y="+gy.toFixed(1)+" cell="+cw.toFixed(1)+"x"+ch.toFixed(1));
 const t=d.querySelectorAll(".game-token")[0];
 t.style.transition="none";
 let fails=0, worst=0, lines=[];
 for(let tile=1;tile<=100;tile++){
   w.gameModel.pawn_positions[0]=tile;
   w.gameView.updateTokenPositions();
   const r=t.getBoundingClientRect();
   const cx=r.left+r.width/2, cy=r.top+r.height/2;
   const row=Math.floor((tile-1)/10), cir=(tile-1)%10;
   const col=(row%2===0)?cir:9-cir;
   const ex=gx+col*cw+cw/2, ey=gy+(9-row)*ch+ch/2;
   const dx=(cx-ex)/cw, dy=(cy-ey)/ch;
   const err=Math.max(Math.abs(dx),Math.abs(dy));
   if(err>worst)worst=err;
   if(err>0.25){fails++; if(lines.length<12) lines.push("tile "+tile+" expect("+ex.toFixed(0)+","+ey.toFixed(0)+") got("+cx.toFixed(0)+","+cy.toFixed(0)+") err=("+dx.toFixed(2)+","+dy.toFixed(2)+")cells");}
 }
 O.push("FAILS "+fails+"/100   worst error "+worst.toFixed(3)+" cells");
 O.push.apply(O,lines);
 document.getElementById("out").textContent=O.join("\n");
}
document.getElementById("f").addEventListener("load",()=>setTimeout(run,3000));
</script>

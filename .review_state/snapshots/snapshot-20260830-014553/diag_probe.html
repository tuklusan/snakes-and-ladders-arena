<!doctype html><meta charset=utf-8><title>probe</title>
<iframe id=f src="index.html" width="1280" height="700" style="border:0"></iframe><pre id=out>x</pre>
<script>
setTimeout(()=>{
 const d=document.getElementById("f").contentDocument;
 const L=[],R=e=>e.getBoundingClientRect();
 const b=d.getElementById("game-board"), br=R(b);
 L.push("board   T="+br.top.toFixed(0)+" B="+br.bottom.toFixed(0)+" L="+br.left.toFixed(0)+" R="+br.right.toFixed(0));
 ["player-panel","player-info","controls","staging","staging-area"].forEach(id=>{
   const e=d.getElementById(id); if(e){const r=R(e);L.push("#"+id+"  T="+r.top.toFixed(0)+" B="+r.bottom.toFixed(0));}});
 d.querySelectorAll("div").forEach(e=>{
   const cs=getComputedStyle(e);
   if(/rgb\(128|rgb\(1[0-9][0-9]/.test(cs.backgroundColor)&&e.offsetHeight>50&&e.offsetWidth>400){
     const r=R(e); L.push("panel? ."+e.className+"#"+e.id+" T="+r.top.toFixed(0)+" B="+r.bottom.toFixed(0)+" bg="+cs.backgroundColor);}});
 const c1=d.querySelector("[data-tile=\"1\"]"); if(c1){const r=R(c1);L.push("cell1   T="+r.top.toFixed(0)+" B="+r.bottom.toFixed(0));}
 d.querySelectorAll(".game-token").forEach((t,i)=>{const r=R(t);
   L.push("token"+i+"  T="+r.top.toFixed(0)+" B="+r.bottom.toFixed(0)+" L="+r.left.toFixed(0)+" parent="+(t.parentElement.dataset.tile?"tile"+t.parentElement.dataset.tile:t.parentElement.id||t.parentElement.className));});
 document.getElementById("out").textContent=L.join("\n");
},5000);
</script>

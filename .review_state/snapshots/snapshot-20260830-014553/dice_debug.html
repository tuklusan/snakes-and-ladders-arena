<!DOCTYPE html>
<html>
<head>
    <title>Dice Debug</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Left margin title panel -->
        <div id="left-title-panel">
            <div class="title-content">
                <div class="title-main">SANYALnet Labs Snakes & Ladders Arena</div>
                <div class="title-sub">© Supratim Sanyal</div>
            </div>
        </div>
        
        <!-- Game board and controls -->
        <div id="game-board-container"></div>
        
        <!-- Right margin commentary panel -->
        <div id="right-commentary-panel">
            <div id="commentary-content"></div>
        </div>
    </div>
    
    <div id="debug-output" style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #0f0; padding: 10px; border-radius: 5px; z-index: 1000; font-family: monospace; font-size: 12px; max-height: 80vh; overflow: auto;">
        <h3>Dice Animation Debug:</h3>
        <div id="debug-log"></div>
    </div>

    <script>
        // Capture console logs
        const logs = [];
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        console.log = function(...args) {
            const message = args.join(' ');
            logs.push({type: 'log', message, time: Date.now()});
            originalLog.apply(console, args);
            // Display in debug output
            const logDiv = document.getElementById('debug-log');
            if (logDiv) {
                logDiv.innerHTML += '<div>' + message + '</div>';
                logDiv.scrollTop = logDiv.scrollHeight;
            }
        };
        
        console.warn = function(...args) {
            const message = args.join(' ');
            logs.push({type: 'warn', message, time: Date.now()});
            originalWarn.apply(console, args);
            // Display in debug output
            const logDiv = document.getElementById('debug-log');
            if (logDiv) {
                logDiv.innerHTML += '<div style="color: ff0;">' + message + '</div>';
                logDiv.scrollTop = logDiv.scrollHeight;
            }
        };
        
        console.error = function(...args) {
            const message = args.join(' ');
            logs.push({type: 'error', message, time: Date.now()});
            originalError.apply(console, args);
            // Display in debug output
            const logDiv = document.getElementById('debug-log');
            if (logDiv) {
                logDiv.innerHTML += '<div style="color: f00;">' + message + '</div>';
                logDiv.scrollTop = logDiv.scrollHeight;
            }
        };
        
        // Load game scripts
        const loadScript = (src) => {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        };
        
        // Run tests after loading scripts
        window.addEventListener('load', async () => {
            try {
                await loadScript('src/js/gameModel.js');
                await loadScript('src/js/gameController.js');
                await loadScript('src/js/gameView.js');
                
                console.log('All scripts loaded');
                
                // Wait a moment for DOM to be ready
                setTimeout(() => {
                    try {
                        // Initialize game
                        const model = new GameModel();
                        const view = new GameView();
                        view.model = model;
                        
                        // Mock assets loading
                        view.assets = {
                            board: {src: '', complete: true},
                            tokens: Array.from({length: 4}, (_, i) => ({src: `token_${i}.png`, complete: true})),
                            diceFaces: Array.from({length: 6}, (_, i) => ({src: `dice_face_${i+1}.png`, complete: true})),
                            diceTumbleSheet: {src: 'dice_tumble_sheet.png', complete: true},
                            audio: {
                                roll: new Audio(),
                                capture: new Audio(),
                                win: new Audio()
                            }
                        };
                        view.isAssetsLoaded = true;
                        view.isAssetsHandled = true;
                        
                        // Create DOM
                        view.createDOM();
                        
                        console.log('View initialized');
                        
                        // Connect controller
                        const controller = new GameController(model, {
                            onStateChange: () => {},
                            onTurnChange: () => {},
                            onExtraRoll: () => {},
                            onTripleSixPenalty: () => {},
                            onGameWin: () => {},
                            onReset: () => {},
                            onCapture: () => {}
                        });
                        view.controller = controller;
                        
                        // Trigger a few rolls to see the dice animation
                        setTimeout(() => {
                            console.log('Triggering roll 3...');
                            controller.processTurn(3);
                        }, 1000);
                        
                        setTimeout(() => {
                            console.log('Triggering roll 5...');
                            controller.processTurn(5);
                        }, 3000);
                        
                        setTimeout(() => {
                            console.log('Triggering roll 2...');
                            controller.processTurn(2);
                        }, 5000);
                        
                    } catch (e) {
                        console.error('Error during test execution:', e);
                    }
                }, 1000);
                
            } catch (e) {
                console.error('Error loading scripts:', e);
            }
        });
    </script>
</body>
</html>

<!doctype html><meta charset=utf-8><title>diag</title>
<style>html,body{margin:0}#f{width:1280px;height:1600px;border:0}</style>
<iframe id=f src="index.html"></iframe>
<pre id=out>pending</pre>
<script>
const GL=0.30, GR=99.68, GT=3.33, GB=98.65;   // measured grid insets, % of image
function run(){
  const d=document.getElementById("f").contentDocument;
  const b=d.getElementById("game-board");
  const L=[];
  if(!b){document.getElementById("out").textContent="NO BOARD";return;}
  const br=b.getBoundingClientRect();
  const cs=d.defaultView.getComputedStyle(b);
  L.push("BOARD div  x="+br.left.toFixed(1)+" y="+br.top.toFixed(1)+" w="+br.width.toFixed(1)+" h="+br.height.toFixed(1)+" ratio="+(br.width/br.height).toFixed(4));
  L.push("  padding-bottom="+cs.paddingBottom+"  overflow="+cs.overflow+"  bg-size="+cs.backgroundSize);
  // painted image box under background-size:contain, natural ratio 4953/6605
  const NR=4953/6605;
  let iw,ih;
  if(br.width/br.height > NR){ ih=br.height; iw=ih*NR; } else { iw=br.width; ih=iw/NR; }
  const ix=br.left+(br.width-iw)/2, iy=br.top+(br.height-ih)/2;
  L.push("IMAGE box  x="+ix.toFixed(1)+" y="+iy.toFixed(1)+" w="+iw.toFixed(1)+" h="+ih.toFixed(1)+"  ratio="+NR.toFixed(4));
  L.push("LETTERBOX  dx="+(ix-br.left).toFixed(1)+"px  dy="+(iy-br.top).toFixed(1)+"px   <-- token drift if nonzero");
  const gx=ix+iw*GL/100, gw=iw*(GR-GL)/100;
  const gy=iy+ih*GT/100, gh=ih*(GB-GT)/100;
  const cw=gw/10, ch=gh/10;
  L.push("GRID       x="+gx.toFixed(1)+" y="+gy.toFixed(1)+" w="+gw.toFixed(1)+" h="+gh.toFixed(1)+" cell="+cw.toFixed(1)+"x"+ch.toFixed(1));
  L.push("");
  for(let i=0;i<4;i++){
    const t=d.querySelector(".game-token.player-"+i)||d.querySelectorAll(".game-token")[i];
    if(!t){L.push("player-"+i+" MISSING");continue;}
    const r=t.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const fc=(cx-gx)/cw, fr=(gy+gh-cy)/ch;
    const inside = cx>=gx && cx<=gx+gw && cy>=gy && cy<=gy+gh;
    const oc=Math.abs(fc-Math.floor(fc)-0.5), orr=Math.abs(fr-Math.floor(fr)-0.5);
    L.push("player-"+i+" size="+r.width.toFixed(0)+"x"+r.height.toFixed(0)
      +" centre=("+cx.toFixed(1)+","+cy.toFixed(1)+")"
      +" col="+fc.toFixed(2)+" row="+fr.toFixed(2)
      +" cellOffset=("+oc.toFixed(2)+","+orr.toFixed(2)+")"
      +(inside?" INSIDE":" OUTSIDE")
      +((inside&&oc<0.25&&orr<0.25)?"  PASS":"  FAIL"));
  }
  document.getElementById("out").textContent=L.join("\n");
}
document.getElementById("f").addEventListener("load",()=>setTimeout(run,3000));
</script>

<!doctype html><meta charset=utf-8><title>walk</title>
<style>body{margin:0;font:13px monospace}#f{width:1280px;height:620px;border:0}
#out{background:#111;color:#0f0;padding:8px;white-space:pre}</style>
<iframe id=f src="index.html"></iframe><pre id=out>running...</pre>
<script>
document.getElementById("f").addEventListener("load",function(){ setTimeout(main,4000); });
var L=[];
function cellOf(d,cells,x,y){
  var best=null,bd=1e9;
  for(var n in cells){var dx=cells[n].x-x,dy=cells[n].y-y,dd=dx*dx+dy*dy;
    if(dd<bd){bd=dd;best=+n;}}
  return {tile:best,dist:Math.sqrt(bd)};
}
function main(){
  var fr=document.getElementById("f"), d=fr.contentDocument, w=fr.contentWindow;
  if(!w.gameView||!w.gameModel){document.getElementById("out").textContent="NO GLOBALS";return;}
  // stop the arena driving itself so the test is deterministic
  try{ w.gameView.clearTimeouts && w.gameView.clearTimeouts(); }catch(e){}
  var cells={},cw=40;
  for(var n=1;n<=100;n++){var c=d.querySelector('[data-tile="'+n+'"]');
    if(c){var r=c.getBoundingClientRect();cells[n]={x:r.left+r.width/2,y:r.top+r.height/2};cw=r.width;}}
  var tok=d.querySelectorAll(".game-token")[0];
  var m=w.gameModel, v=w.gameView;

  // CASE: player 0 on 26, rolls 2 -> lands 28 -> ladder 28->84
  m.pawn_positions[0]=26;
  if(m.setLastRoll) m.setLastRoll(2); else m.lastRoll=2;
  if(m.setLastMover) m.setLastMover(0);
  v.previousPositions[0]=26;
  try{ v.positionTokenOnTile(0,26); }catch(e){}
  var seq=[], t0=performance.now();
  var sampler=setInterval(function(){
    var r=tok.getBoundingClientRect();
    var hit=cellOf(d,cells,r.left+r.width/2,r.top+r.height/2);
    if(hit.dist<cw*0.45){ if(!seq.length||seq[seq.length-1]!==hit.tile) seq.push(hit.tile); }
  },25);
  m.pawn_positions[0]=84;
  v.animateTokenMove(0,84);
  setTimeout(function(){
    clearInterval(sampler);
    L.push("CASE: tile 26, roll 2 -> foot of ladder 28 -> 84");
    L.push("observed tile sequence:");
    L.push("  "+seq.join(" "));
    var walked = seq.indexOf(27)>=0 && seq.indexOf(28)>=0;
    var direct = seq.length<=3;
    L.push("");
    L.push("visited 27 : "+(seq.indexOf(27)>=0));
    L.push("visited 28 : "+(seq.indexOf(28)>=0)+"   (ladder foot - must be visited)");
    L.push("ended  84 : "+(seq[seq.length-1]===84));
    L.push("distinct cells touched: "+seq.length);
    L.push("");
    L.push(walked ? "PASS - the piece walked to the ladder foot"
                  : (direct ? "FAIL - TELEPORT, went straight to the destination"
                            : "FAIL - did not visit 27/28"));
    document.getElementById("out").textContent=L.join("\n");
  }, 9000);
}
</script>

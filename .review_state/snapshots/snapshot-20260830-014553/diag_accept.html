<!doctype html><meta charset=utf-8><title>accept</title>
<style>html,body{margin:0}#f{border:0;display:block}</style>
<iframe id=f src="index.html" width="900" height="600"></iframe>
<pre id=out>pending</pre>
<script>
function run(){
 const fr=document.getElementById("f"),d=fr.contentDocument,w=fr.contentWindow;
 const L=[],P=(k,ok,v)=>L.push((ok?"PASS  ":"FAIL  ")+k.padEnd(26)+v);
 try{
  // 1. fits 600
  const sh=d.documentElement.scrollHeight;
  P("DR110_scrollHeight<=600", sh<=600, sh+"px");
  const scroll = d.documentElement.scrollHeight > d.documentElement.clientHeight+1;
  P("DR110_no_vscrollbar", !scroll, scroll?"scrolls":"no scroll");
  // 2. board square
  const b=d.getElementById("game-board");
  if(!b){L.push("FAIL  board element           missing");}
  else{
   const r=b.getBoundingClientRect();
   const ratio=r.width/r.height, sq=Math.abs(ratio-1)<=0.02;
   P("DR110_board_square", sq, r.width.toFixed(0)+"x"+r.height.toFixed(0)+" ratio="+ratio.toFixed(3));
  }
  // 3. 100 addressable cells
  let cells=d.querySelectorAll("[data-tile]").length;
  if(!cells) cells=d.querySelectorAll(".tile,.cell,.board-cell,.grid-cell").length;
  P("DR108_100_cells", cells===100, cells+" cells");
  // 4. tokens visible >=20px
  const toks=d.querySelectorAll(".game-token");
  let minT=1e9; toks.forEach(t=>{const r=t.getBoundingClientRect(); minT=Math.min(minT,r.width);});
  P("DR110_tokens>=20px", toks.length===4&&minT>=20, toks.length+" tokens, min "+(minT===1e9?"n/a":minT.toFixed(0)+"px"));
  // 5. tile numbers >=9px
  let fs=0, numEl=null;
  const cand=d.querySelector("[data-tile]")||d.querySelector(".tile,.cell,.board-cell,.grid-cell");
  if(cand){ numEl=cand; fs=parseFloat(w.getComputedStyle(cand).fontSize)||0; }
  P("DR110_numbers>=9px", fs>=9, fs?fs.toFixed(1)+"px":"no numbered cell found");
  // 6. connectors present (procedural board: 6-9 ladders + 6-9 snakes = 12-18)
  const conn=d.querySelectorAll("[data-jump],.ladder,.snake,.connector").length;
  P("DR108_connectors_in_range", conn>=8 && conn<=12, conn+" connectors (expect 8-12)");
  // 7. tokens must occupy DISTINCT positions (not stacked)
  const pos=new Set(); toks.forEach(t=>{const r=t.getBoundingClientRect(); pos.add(r.left.toFixed(0)+","+r.top.toFixed(0));});
  P("VIS_tokens_distinct", pos.size===toks.length, pos.size+" distinct of "+toks.length);
  // 8. staging tokens must NOT sit on tile 100's cell
  const c100=d.querySelector('[data-tile="100"]');
  let onC100=0;
  if(c100){const q=c100.getBoundingClientRect();
    toks.forEach(t=>{const r=t.getBoundingClientRect();
      if(Math.abs(r.left-q.left)<5&&Math.abs(r.top-q.top)<5) onC100++;});}
  P("VIS_tokens_not_on_100", onC100===0, onC100+" tokens on cell 100");
  // 9. dice must not overlap the board
  const bb=b.getBoundingClientRect();
  const dice=d.getElementById("dice-container")||d.querySelector("[id*=dice]");
  let ov=false; if(dice){const r=dice.getBoundingClientRect();
    ov = r.left<bb.right && r.right>bb.left && r.top<bb.bottom && r.bottom>bb.top;}
  P("VIS_dice_off_board", dice&&!ov, dice?(ov?"overlaps board":"clear"):"no dice el");
  // 10. cells must have visible grid lines
  const c1=d.querySelector("[data-tile]");
  let bw=0; if(c1){const st=w.getComputedStyle(c1); bw=parseFloat(st.borderTopWidth)||parseFloat(st.outlineWidth)||0;}
  P("VIS_grid_lines", bw>0, bw+"px border");
  // 11. connectors must render BEHIND the numbers
  const svg=d.querySelector("#game-board svg");
  let behind=false;
  if(svg&&c1){ const zs=parseInt(w.getComputedStyle(svg).zIndex)||0;
    const zc=parseInt(w.getComputedStyle(c1).zIndex)||0;
    behind = zs<zc || (svg.compareDocumentPosition(c1)&Node.DOCUMENT_POSITION_FOLLOWING)!==0; }
  P("VIS_connectors_behind", behind, svg?("svg z="+(w.getComputedStyle(svg).zIndex)):"no svg");
  // 12. the loading overlay must be gone and the game actually started
  const bodyTxt=(d.body.innerText||"");
  const loading=/Loading game assets/i.test(bodyTxt);
  P("VIS_loading_cleared", !loading, loading ? "STILL LOADING" : "cleared");
  // 13/14. nothing may be hidden behind the player panel
  const panel=d.getElementById("player-info")||d.querySelector("#player-panel,.player-info");
  const inter=(a,z)=>a.left<z.right&&a.right>z.left&&a.top<z.bottom&&a.bottom>z.top;
  // REPURPOSED (P1-P4 panel removed by design): assert the panel is ABSENT and that the
  // board plus every token fit inside the shorter app container un-clipped.
  const appc=d.getElementById("game-container");
  const gcr=appc?appc.getBoundingClientRect():null, bb2=b.getBoundingClientRect();
  P("VIS_board_not_clipped", !panel && !!gcr && bb2.bottom<=gcr.bottom+1, panel?"panel still present":("board B="+bb2.bottom.toFixed(0)+" app B="+(gcr?gcr.bottom.toFixed(0):"?")));
  let clip=0; toks.forEach(t=>{ const r=t.getBoundingClientRect(); if(gcr && (r.top<gcr.top-1||r.bottom>gcr.bottom+1||r.left<gcr.left-1||r.right>gcr.right+1)) clip++; });
  P("VIS_all_tokens_visible", !panel && clip===0, panel?"panel present":(clip+" tokens clipped by app edges"));
  // 15. staged tokens must sit inside the staging strip
  const st=d.getElementById("staging")||d.getElementById("staging-area")||d.querySelector(".staging,.staging-area");
  if(st){ const sr=st.getBoundingClientRect(); let outside=0;
    toks.forEach(t=>{ const r=t.getBoundingClientRect();
      const staged = r.top>=sr.top-2 && r.bottom<=sr.bottom+2;
      if(staged && (r.left<sr.left-1 || r.right>sr.right+1)) outside++; });
    P("VIS_staging_contained", outside===0, outside+" staged tokens outside strip");
  // 16. there must be NO roll button (fully automatic arena)
  var rb=d.getElementById("roll-button");
  if(!rb){ var bl=d.querySelectorAll("button");
    for(var q=0;q<bl.length;q++){ if(/roll/i.test(bl[q].textContent||"")){ rb=bl[q]; break; } } }
  P("VIS_no_roll_button", !rb, rb?("found: "+(rb.id||rb.textContent)):"none");
  // 17. turn indicator must be visible below dice
  // 19/20. the side panels must not overlap the board or each other
  var bb3=b.getBoundingClientRect();
  var cm=d.getElementById("right-commentary-panel");
  var tt=d.getElementById("left-title-panel");
  var dc=d.getElementById("dice-container");
  var ix=function(a,z){return a&&z&&a.left<z.right&&a.right>z.left&&a.top<z.bottom&&a.bottom>z.top;};
  var cr=cm?cm.getBoundingClientRect():null, tr2=tt?tt.getBoundingClientRect():null,
      dr2=dc?dc.getBoundingClientRect():null;
  var bad=[];
  if(!cm) bad.push("commentary missing");
  else if(ix(cr,bb3)) bad.push("commentary overlaps board by "+Math.round(bb3.right-cr.left)+"px");
  if(!tt) bad.push("title missing");
  else if(ix(tr2,bb3)) bad.push("title overlaps board");
  P("VIS_panels_no_overlap", bad.length===0, bad.length?bad.join("; "):"board clear of both panels");
  var bad2=[];
  if(dr2&&cr&&ix(dr2,cr)) bad2.push("dice overlaps commentary");
  if(cm){
    // the scrollable element may be the panel itself or an inner content div
    var cands=[cm].concat(Array.prototype.slice.call(cm.querySelectorAll("*")));
    var scrolls=false;
    for(var si=0;si<cands.length;si++){
      var oy=w.getComputedStyle(cands[si]).overflowY;
      if(oy==="auto"||oy==="scroll"){ scrolls=true; break; }
    }
    if(!scrolls) bad2.push("no scrollable element inside commentary (need overflow-y auto/scroll)");
  }
  P("VIS_commentary_scrolls", bad2.length===0, bad2.length?bad2.join("; "):"dice clear, overflow-y ok");
  // the dice must actually draw something: a background image, and if it is the
  // sprite sheet then background-size must be the full scaled strip, not
  // "contain" - contain squashes 12 frames into the element and the pixel
  // offsets then push the image outside it entirely.
  var dcE=d.getElementById("dice-container");
  var dw=[];
  if(!dcE) dw.push("dice element missing");
  else{
    var dcs=w.getComputedStyle(dcE);
    var bi=dcs.backgroundImage||"none";
    if(bi==="none") dw.push("no background image");
    if(/tumble_sheet/.test(bi)){
      var bs=dcs.backgroundSize||"";
      var box=Math.round(dcE.getBoundingClientRect().width);
      var firstNum=parseFloat(bs);
      if(bs==="contain"||bs==="cover") dw.push("sheet with background-size:"+bs+" (frames collapse)");
      else if(!isNaN(firstNum)&&firstNum<box*2) dw.push("sheet scaled to "+bs+" but element is "+box+"px; strip must be frames x element width");
    }
  }
  P("VIS_dice_renders", dw.length===0, dw.length?dw.join("; "):"dice has a usable background");

  // the app no longer has a fixed width: the client approved narrowing it once
  // the right sidebar was halved. What matters is that the columns account for
  // the whole width - no dead space padding it back out - and that the right
  // column is genuinely narrow.
  var gc=d.getElementById("game-container");
  var gw=gc?Math.round(gc.getBoundingClientRect().width):0;
  var lt2=d.getElementById("left-title-panel");
  var cm3=d.getElementById("right-commentary-panel");
  var rc=d.getElementById("right-column")||d.querySelector(".right-column")||cm3;
  var rw=rc?Math.round(rc.getBoundingClientRect().width):0;
  var lw=lt2?Math.round(lt2.getBoundingClientRect().width):0;
  var bw2=Math.round(b.getBoundingClientRect().width);
  var sum=lw+bw2+rw;
  P("VIS_no_dead_space", gw>0&&sum>0&&(gw-sum)<=80,
    "app "+gw+"px vs columns "+lw+"+"+bw2+"+"+rw+"="+sum+" (slack "+(gw-sum)+"px)");
  P("VIS_right_column_narrow", rw>0&&rw<=190, "right column "+rw+"px (target ~176)");
  // 22. the board must never shrink to make room for the side panels
  var bwid=Math.round(b.getBoundingClientRect().width);
  P("VIS_board_not_shrunk", bwid>=380, bwid+"px (must stay >=380)");
  // 23. every commentary line must be legible against its panel background
  function lum(c){
    var m=c.match(/[0-9]+/g); if(!m) return null;
    var v=m.slice(0,3).map(function(x){ x=x/255; return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4); });
    return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2];
  }
  var cm2=d.getElementById("right-commentary-panel");
  var worst=null, worstTxt="", nLines=0;
  if(cm2){
    var bgEl=cm2, bgc=w.getComputedStyle(bgEl).backgroundColor;
    while(bgc==="rgba(0, 0, 0, 0)"&&bgEl.parentElement){ bgEl=bgEl.parentElement; bgc=w.getComputedStyle(bgEl).backgroundColor; }
    var bl=lum(bgc); if(bl===null) bl=1;
    var lines=cm2.querySelectorAll("div,span,p");
    for(var li=0; li<lines.length; li++){
      var el=lines[li]; if(!(el.textContent||"").trim()) continue;
      if(el.children.length) continue;
      nLines++;
      var fl=lum(w.getComputedStyle(el).color); if(fl===null) continue;
      var ratio=(Math.max(fl,bl)+0.05)/(Math.min(fl,bl)+0.05);
      if(worst===null||ratio<worst){ worst=ratio; worstTxt=(el.textContent||"").trim().slice(0,26); }
    }
  }
  P("VIS_commentary_contrast", nLines>0&&worst!==null&&worst>=4.5,
    nLines===0?"NO LINES RENDERED (cannot pass)":(worst.toFixed(2)+":1 worst of "+nLines+" lines"));



  } else { P("VIS_staging_contained", false, "no staging element"); }





 }catch(e){L.push("ERROR "+e.message);}
 document.getElementById("out").textContent=L.join("\n");
}
document.getElementById("f").addEventListener("load",()=>setTimeout(run,9000));
</script>

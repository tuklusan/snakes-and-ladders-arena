<!doctype html><meta charset=utf-8><title>traverse</title>
<style>body{margin:0;font:13px monospace}#f{width:1280px;height:640px;border:0}
#out{background:#111;color:#0f0;padding:8px;white-space:pre;font:13px monospace}</style>
<iframe id=f src="index.html"></iframe><pre id=out>sampling...</pre>
<script>
var seqs=[[],[],[],[]], cells=null, started=Date.now();
function centres(d){
  var m={};
  for(var n=1;n<=100;n++){
    var c=d.querySelector('[data-tile="'+n+'"]');
    if(c){var r=c.getBoundingClientRect(); m[n]={x:r.left+r.width/2,y:r.top+r.height/2,w:r.width};}
  }
  return m;
}
function nearest(m,x,y){
  var best=null,bd=1e9;
  for(var n in m){var dx=m[n].x-x,dy=m[n].y-y,d=dx*dx+dy*dy; if(d<bd){bd=d;best=+n;}}
  return {tile:best,dist:Math.sqrt(bd),cw:m[best]?m[best].w:1};
}
setInterval(function(){
  var w=document.getElementById("f").contentWindow, d=document.getElementById("f").contentDocument;
  try{
    if(!cells||Object.keys(cells).length<100) cells=centres(d);
    var toks=d.querySelectorAll(".game-token");
    for(var i=0;i<toks.length&&i<4;i++){
      var r=toks[i].getBoundingClientRect();
      var nr=nearest(cells,r.left+r.width/2,r.top+r.height/2);
      // only record when the token is genuinely near a cell centre
      if(nr.dist < nr.cw*0.42){
        var s=seqs[i];
        if(s.length===0||s[s.length-1]!==nr.tile) s.push(nr.tile);
      }
    }
  }catch(e){}
  var out=[], t=((Date.now()-started)/1000)|0;
  out.push("elapsed "+t+"s   (sampling every 40ms, recording tile-centre visits)");
  for(var i=0;i<4;i++){
    var s=seqs[i];
    var steps=0, leaps=0, leapList=[];
    for(var k=1;k<s.length;k++){
      var delta=Math.abs(s[k]-s[k-1]);
      if(delta===1) steps++; else { leaps++; if(leapList.length<6) leapList.push(s[k-1]+"->"+s[k]); }
    }
    out.push("P"+(i+1)+" visits="+s.length+" adjacentSteps="+steps+" nonAdjacent="+leaps
             +(leapList.length?("  ["+leapList.join(", ")+"]"):""));
    out.push("   "+s.slice(-40).join(" "));
  }
  document.getElementById("out").textContent=out.join("\n");
},40);
</script>

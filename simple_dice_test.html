<!DOCTYPE html>
<html>
<head>
    <title>Simple Dice Test</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <div id="game-container">
        <div id="left-title-panel">
            <div class="title-content">
                <div class="title-main">SANYALnet Labs Snakes & Ladders Arena</div>
                <div class="title-sub">© Supratim Sanyal</div>
            </div>
        </div>
        <div id="game-board-container"></div>
        <div id="right-commentary-panel">
            <div id="commentary-content"></div>
        </div>
    </div>

    <script>
        // Simple test to see if we can get the dice animation working
        console.log('=== Starting Simple Dice Test ===');
        
        // Mock the browser environment for Image and Audio
        const originalImage = window.Image;
        window.Image = class {
            constructor() {
                this.src = '';
                this.complete = true;
                this.onload = null;
                this.onerror = null;
            }
        };
        
        const originalAudio = window.Audio;
        window.Audio = class {
            constructor(src) {
                this.src = src;
                this.currentTime = 0;
            }
            play() { return Promise.resolve(); }
            pause() {}
        };
        
        // Mock requestAnimationFrame to work with our test
        let frameId = 0;
        window.requestAnimationFrame = function(callback) {
            frameId++;
            // Call callback immediately with a timestamp
            const timestamp = performance.now() + (frameId * 16); // ~60fps
            return callback(timestamp);
        };
        
        // Load and test the game view directly
        try {
            console.log('Loading game scripts...');
            
            // Load scripts synchronously for testing
            const modelCode = `self.window = window; self.document = document; 
                (function() { 
                    ${document.querySelector('script[src*="gameModel"]').textContent}
                }).call(self);`;
                
            // Instead, let's just fetch and eval them
            fetch('src/js/gameModel.js')
                .then(response => response.text())
                .then(text => {
                    eval(text);
                    return fetch('src/js/gameController.js');
                })
                .then(response => response.text())
                .then(text => {
                    eval(text);
                    return fetch('src/js/gameView.js');
                })
                .then(response => response.text())
                .then(text => {
                    eval(text);
                    console.log('Scripts loaded successfully');
                    
                    // Now test
                    const model = new GameModel();
                    const view = new GameView();
                    view.model = model;
                    
                    // Mock assets
                    view.assets = {
                        board: {src: '', complete: true},
                        tokens: Array.from({length: 4}, (_, i) => ({src: `token_${i}.png`, complete: true})),
                        diceFaces: Array.from({length: 6}, (_, i) => ({src: `dice_face_${i+1}.png`, complete: true})),
                        diceTumbleSheet: {src: 'dice_tumble_sheet.png', complete: true},
                        audio: {
                            roll: new Audio(),
                            capture: new Audio(),
                            win: new Audio()
                        }
                    };
                    view.isAssetsLoaded = true;
                    view.isAssetsHandled = true;
                    
                    // Create minimal DOM for testing
                    const container = document.createElement('div');
                    container.id = 'game-container';
                    container.innerHTML = `
                        <div id="left-title-panel"></div>
                        <div id="game-board-container"></div>
                        <div id="right-commentary-panel">
                            <div id="commentary-content"></div>
                        </div>
                    `;
                    document.body.appendChild(container);
                    
                    view.createDOM();
                    console.log('View created, testing animateDiceRoll...');
                    
                    // Test the animation
                    let settleCount = 0;
                    const originalUpdateDice = view.updateDice;
                    view.updateDice = function(face) {
                        console.log(`[TEST] updateDice called with face: ${face}`);
                        return originalUpdateDice.call(this, face);
                    };
                    
                    const originalConsoleLog = console.log;
                    console.log = function(...args) {
                        const message = args.join(' ');
                        if (message.includes('dice settled') || message.includes('animateDiceRoll: updateDice called')) {
                            console.log(`[TEST LOG] ${message}`);
                        }
                        originalConsoleLog.apply(console, args);
                    };
                    
                    console.log('Calling animateDiceRoll(3)...');
                    view.animateDiceRoll(3, () => {
                        console.log('[TEST] animateDiceRoll callback called');
                    });
                    
                    // Wait a bit to see results
                    setTimeout(() => {
                        console.log('[TEST] Test completed');
                    }, 3000);
                })
                .catch(err => {
                    console.error('Error loading scripts:', err);
                });
                
        } catch (e) {
            console.error('Error in test:', e);
        }
    </script>
</body>
</html>
